<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keitaro · Кампании</title>
<link rel="stylesheet" href="/static/style.css?v=2">
<script type="module" src="/static/app.js?v=2"></script>
</head>
<body>
<main>
<header><span>KEITARO</span><h1>Кампании и офферы</h1></header>
<p class="intro">Настройте, куда пойдут переходы, или измените офферы в существующей кампании.</p>
<p id="status" role="status">Подключаемся к Keitaro…</p>
<div class="layout">
<section>
<h2>Создать кампанию</h2>
<form id="create">
<label>Название <small id="prefix"></small><input name="name" required maxlength="100" pattern="[A-Za-z0-9][A-Za-z0-9_\-]*" placeholder="campaign1"></label>
<label>Код страны<input name="country" required minlength="2" maxlength="2" pattern="[A-Za-z]{2}" placeholder="DE"></label>
<label>Оффер<select name="offer_id" required></select></label>
<label>Домен<select name="domain_id" required></select></label>
<label>Группа<select name="group_id" required></select></label>
<label>Источник<select name="traffic_source_id" required></select></label>
<button>Создать кампанию</button>
</form>
</section>
<section>
<h2>Редактор офферов</h2>
<div class="toolbar"><label>Кампания<select id="campaign"></select></label><button id="reload" class="secondary" type="button">Обновить</button></div>
<p id="stats-note"></p>
<div id="flows"></div>
</section>
</div>
</main>
</body>
</html>
